apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp138-api
  labels:
    app: mp138-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mp138-api
  template:
    metadata:
      labels:
        app: mp138-api
    spec:
      containers:
      - name: mp138-api
        image: mp138-api:1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 20
          periodSeconds: 15
          timeoutSeconds: 3
